[project]
name = "aimakerspace"
version = "0.1.0"
description = "AI Maker Space utilities"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "fastapi>=0.104.1",
    "openai>=1.3.0",
    "pydantic>=2.5.0",
    "uvicorn>=0.24.0",
    "PyPDF2>=3.0.1",
    "numpy>=1.24.3",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.6",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["aimakerspace*"]
